  summary: Researcher in population epidemiology with a background in statistics and economics. Focus on social inequalities, adolescent well-being and health behaviors, with the objective of improving public health policies through scientific evidence. Currently working on addictive behaviors and dopaminergic stimulation at Geneva University Hospitals. Highly interested in pluridisciplinary teamwork, advanced statistical models and communication in science for a broader audience.

